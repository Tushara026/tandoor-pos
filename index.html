<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tandoor POS">
<title>Tandoor & Co. POS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#211A14;--panel:#2B2118;--panel2:#382B20;--paper:#F3ECDC;--paper2:#E8DEC7;--ink:#2B2118;--muted:#6B5E4C;--gold:#C6902B;--gold2:#A6741F;--red:#A3352A;--green:#557A43;--line:rgba(243,236,220,.13)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.mono{font-family:'IBM Plex Mono',monospace}.display{font-family:Bitter,serif}
.app{min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;background:rgba(33,26,20,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(198,144,43,.2)}
.topin{max-width:1100px;margin:auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-size:21px}.brand h1{font:800 18px Bitter;margin:0}.brand small{color:#b9ad9c;font-size:10px}.topactions{display:flex;gap:6px}.topbtn{border:1px solid rgba(198,144,43,.3);background:rgba(198,144,43,.08);color:var(--gold);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:700}.layout{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px}.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:11px;padding:11px 13px;margin-bottom:10px}.cats{display:flex;gap:7px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.cats button{white-space:nowrap;border:0;border-radius:22px;padding:8px 12px;background:rgba(243,236,220,.08);color:#d7ccba;font-size:11px;font-weight:700}.cats button.active{background:var(--gold);color:var(--bg)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:var(--panel);border:1px solid rgba(198,144,43,.14);border-radius:12px;padding:11px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between}.cardname{font:700 14px Bitter;line-height:1.15}.price{color:var(--gold);font:600 12px 'IBM Plex Mono';margin-top:5px}.add{border:1px solid rgba(198,144,43,.5);background:rgba(198,144,43,.1);color:var(--gold);border-radius:7px;padding:7px 9px;font-size:11px;font-weight:800;align-self:flex-start}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qbtn{width:29px;height:29px;border:0;border-radius:7px;background:#3a2a20;color:var(--gold);font-weight:900}.qbtn.red{color:#e78b7d;background:rgba(163,53,42,.16)}.qnum{min-width:20px;text-align:center;font:700 12px 'IBM Plex Mono'}.receipt{background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.35);position:sticky;top:72px}.perforation{height:10px;background:radial-gradient(circle,var(--bg) 45%,transparent 46%);background-size:14px 14px;background-position:-3px center;repeat-x}.rhead{text-align:center;padding:15px 18px 11px;border-bottom:1px dashed rgba(43,33,24,.2)}.rhead h2{font:800 20px Bitter;margin:0}.rhead small{font-size:9px;color:var(--muted)}.rinfo{padding:10px 18px 7px;font:10px 'IBM Plex Mono';color:var(--muted)}.row{display:flex;justify-content:space-between;gap:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px 18px 10px}.fields input,.discount input,.discount select{width:100%;padding:8px;border:1px solid rgba(43,33,24,.15);background:var(--paper2);border-radius:6px;color:var(--ink);font-size:10px}.items{border-top:1px dashed rgba(43,33,24,.2);border-bottom:1px dashed rgba(43,33,24,.2);padding:11px 18px}.empty{text-align:center;color:var(--muted);font-size:10px;padding:25px 0}.lineitem{font:10px 'IBM Plex Mono';margin-bottom:9px}.linehead{display:flex;align-items:baseline}.dots{flex:1;border-bottom:1px dotted var(--muted);height:1px;margin:0 5px;transform:translateY(-3px)}.linecontrols{display:flex;align-items:center;gap:7px;color:var(--muted);margin-top:4px}.iconbtn{border:0;background:transparent;color:var(--red);padding:0}.totals{padding:11px 18px;font:10px 'IBM Plex Mono'}.total{border-top:1px solid rgba(43,33,24,.2);margin-top:9px;padding-top:9px;font-size:16px;font-weight:800}.discount{padding:0 18px 10px;display:grid;grid-template-columns:1fr 70px;gap:7px}.payments{padding:0 18px 10px}.paytitle{font-size:9px;color:var(--muted);font-weight:800;margin-bottom:5px}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pay{padding:8px 4px;border-radius:7px;border:1px solid rgba(43,33,24,.15);background:transparent;color:var(--ink);font-size:9px;font-weight:800}.pay.active{background:rgba(198,144,43,.2);border:2px solid var(--gold)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 18px 13px}.act{padding:10px;border:0;border-radius:7px;font-size:10px;font-weight:800}.print{background:var(--green);color:white}.complete{background:var(--gold);color:var(--bg)}.clear{grid-column:1/-1;background:transparent;color:var(--red);border:1px solid rgba(163,53,42,.2)}.rf{text-align:center;padding:10px 18px 13px;border-top:1px dashed rgba(43,33,24,.2);font-size:9px;color:var(--muted)}.bottom{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;padding:15px;display:flex;align-items:center;justify-content:center}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:14px}.mh{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid rgba(43,33,24,.15)}.mh h2{font:800 20px Bitter;margin:0}.close{border:0;background:transparent;color:var(--ink);font-size:20px}.mb{padding:15px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.settings input,.newrow input,.newrow select,.edit input,.edit select{width:100%;padding:8px;border:1px solid rgba(43,33,24,.15);background:var(--paper2);border-radius:6px;color:var(--ink);font-size:11px}.newrow{display:grid;grid-template-columns:2fr 1fr 100px 40px;gap:6px;background:rgba(198,144,43,.1);padding:10px;border-radius:8px;margin-bottom:10px}.save{border:0;background:var(--gold);color:var(--bg);padding:9px 14px;border-radius:7px;font-weight:800}.edit{display:grid;grid-template-columns:2fr 1fr 90px 35px;gap:6px;margin-bottom:6px}.del{border:0;background:rgba(163,53,42,.12);color:var(--red);border-radius:6px}.modalfoot{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.historycard{border:1px solid rgba(43,33,24,.12);border-radius:8px;padding:10px;margin-bottom:7px}.periods{display:flex;gap:6px;margin-bottom:12px}.periods button{border:0;border-radius:7px;padding:8px 10px;background:var(--paper2);font-size:10px;font-weight:800}.periods button.active{background:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}.stat{background:var(--bg);color:var(--paper);border-radius:9px;padding:11px}.stat small{font-size:8px;color:#aaa}.stat b{display:block;color:var(--gold);font:700 17px 'IBM Plex Mono';margin-top:4px}
@media(max-width:850px){.layout{display:block;padding:8px}.receipt{position:fixed;inset:auto 7px 66px 7px;z-index:15;max-height:72vh;overflow:auto;transform:translateY(calc(100% - 55px));transition:.25s}.receipt.open{transform:translateY(0)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:55px}.topactions .sales{display:none}.bottom{display:grid;position:fixed;z-index:30;bottom:0;left:0;right:0;height:62px;background:rgba(25,19,15,.98);grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(198,144,43,.25)}.bottom button{border:0;background:transparent;color:#cfc2af;font-size:10px}.bottom button.active{color:var(--gold)}.bottom b{display:block;font-size:15px;margin-bottom:2px}.brand h1{font-size:16px}.topbtn{padding:8px}.receipt{top:auto}.newrow,.edit{grid-template-columns:1fr 1fr}.newrow button{grid-column:1/-1;padding:8px}.edit button{grid-column:auto}.settings{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.rhead h2{font-size:18px}}
@media(max-width:430px){.grid{gap:7px}.card{padding:9px;min-height:105px}.cardname{font-size:13px}.topin{padding:10px}.logo{width:38px;height:38px}.topbtn{font-size:10px}.receipt{max-height:75vh}.stats .stat{padding:8px}.stat b{font-size:14px}}
@media print{body{background:white!important}.no-print,.top,.bottom{display:none!important}.layout{display:block;padding:0}.receipt{position:static;transform:none!important;box-shadow:none!important;width:80mm;margin:auto;max-height:none!important;overflow:visible}.receipt .no-print{display:none!important}.app{padding:0}.perforation{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATS=["Starters","Main Course","Breads","Rice & Biryani","Desserts","Beverages"];
const DEFAULT=[
["m1","Paneer Tikka","Starters",220],["m2","Chicken 65","Starters",240],["m3","Veg Spring Roll","Starters",180],["m4","Chilli Paneer","Starters",210],["m5","Tandoori Chicken (Half)","Starters",280],["m6","Hara Bhara Kebab","Starters",190],
["m7","Butter Chicken","Main Course",320],["m8","Paneer Butter Masala","Main Course",280],["m9","Dal Makhani","Main Course",220],["m10","Kadai Vegetable","Main Course",240],["m11","Chicken Curry","Main Course",300],["m12","Palak Paneer","Main Course",260],
["m13","Butter Naan","Breads",60],["m14","Garlic Naan","Breads",70],["m15","Tandoori Roti","Breads",40],["m16","Laccha Paratha","Breads",65],
["m17","Veg Biryani","Rice & Biryani",220],["m18","Chicken Biryani","Rice & Biryani",280],["m19","Jeera Rice","Rice & Biryani",160],["m20","Curd Rice","Rice & Biryani",150],
["m21","Gulab Jamun","Desserts",90],["m22","Rasmalai","Desserts",110],["m23","Kulfi","Desserts",100],
["m24","Masala Chai","Beverages",40],["m25","Sweet Lassi","Beverages",80],["m26","Fresh Lime Soda","Beverages",70],["m27","Mineral Water","Beverages",30]
].map(x=>({id:x[0],name:x[1],category:x[2],price:x[3]}));
const rupee=n=>"₹"+Number(n||0).toFixed(2);
let state={
 restaurantName:localStorage.posName||"Tandoor & Co.",gstin:localStorage.posGstin||"22ABCDE1234F1Z5",
 menu:JSON.parse(localStorage.posMenu||"null")||DEFAULT,billNo:Number(localStorage.posBill||1001),
 history:JSON.parse(localStorage.posHistory||"[]"),cat:"Starters",search:"",cart:{},table:"",customer:"",discount:0,discountType:"amount",payment:"Cash",cartOpen:false,modal:null,period:"today"
};
function save(){localStorage.posName=state.restaurantName;localStorage.posGstin=state.gstin;localStorage.posMenu=JSON.stringify(state.menu);localStorage.posBill=state.billNo;localStorage.posHistory=JSON.stringify(state.history.slice(-100))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function totals(){
 let lines=Object.entries(state.cart).map(([id,qty])=>{let i=state.menu.find(x=>x.id===id);return i?{...i,qty,amount:i.price*qty}:null}).filter(Boolean);
 let subtotal=lines.reduce((a,x)=>a+x.amount,0), d=state.discountType==="percent"?subtotal*Number(state.discount||0)/100:Number(state.discount||0);d=Math.min(Math.max(d,0),subtotal);
 let taxable=subtotal-d,cgst=taxable*.025,sgst=taxable*.025,totalExact=taxable+cgst+sgst,grand=Math.round(totalExact);
 return {lines,subtotal,d,taxable,cgst,sgst,round:grand-totalExact,grand,qty:lines.reduce((a,x)=>a+x.qty,0)}
}
function render(){
 const t=totals(), q=state.search.toLowerCase();
 const items=state.menu.filter(i=>i.category===state.cat&&(!q||i.name.toLowerCase().includes(q)));
 const today=state.history.filter(b=>new Date(b.date).toDateString()===new Date().toDateString());
 const todayTotal=today.reduce((a,b)=>a+b.total,0);
 document.getElementById("app").innerHTML=`
 <div class="app">
  <header class="top no-print"><div class="topin">
   <div class="brand"><div class="logo">♨</div><div><h1>${esc(state.restaurantName)}</h1><small>Billing Counter</small></div></div>
   <div class="topactions"><button class="topbtn sales" onclick="openHistory()">↗ Sales</button><button class="topbtn" onclick="openHistory()">◷ History</button><button class="topbtn" onclick="openManage()">⚙</button></div>
  </div></header>
  <main class="layout">
   <section class="no-print">
    <input class="search" placeholder="Search menu items..." value="${esc(state.search)}" oninput="state.search=this.value;render()">
    <div class="cats">${CATS.map(c=>`<button class="${state.cat===c?'active':''}" onclick="state.cat='${c}';render()">${c}</button>`).join("")}</div>
    <div class="grid">${items.map(i=>{let n=state.cart[i.id]||0;return `<div class="card"><div><div class="cardname">${esc(i.name)}</div><div class="price">${rupee(i.price)}</div></div>${n?`<div class="qty"><button class="qbtn red" onclick="dec('${i.id}')">−</button><span class="qnum">${n}</span><button class="qbtn" onclick="add('${i.id}')">+</button></div>`:`<button class="add" onclick="add('${i.id}')">+ Add</button>`}</div>`}).join("")}</div>
   </section>
   <aside class="receipt ${state.cartOpen?'open':''}">
    <div class="perforation"></div>
    <div class="rhead"><h2>${esc(state.restaurantName)}</h2><small>GSTIN: ${esc(state.gstin)} · Dine-in Bill</small></div>
    <div class="rinfo"><div class="row"><span>Bill No: ${state.billNo}</span><span>${new Date().toLocaleDateString("en-IN")}</span></div><div style="margin-top:3px">${new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</div></div>
    <div class="fields no-print"><input placeholder="Table no." value="${esc(state.table)}" oninput="state.table=this.value"><input placeholder="Customer" value="${esc(state.customer)}" oninput="state.customer=this.value"></div>
    ${state.table||state.customer?`<div style="padding:0 18px 8px;font:9px 'IBM Plex Mono';color:var(--muted)" class="printinfo">${state.table?`Table: ${esc(state.table)}<br>`:""}${state.customer?`Customer: ${esc(state.customer)}`:""}</div>`:""}
    <div class="items">${t.lines.length?t.lines.map(i=>`<div class="lineitem"><div class="linehead"><span>${esc(i.name)}</span><span class="dots"></span><b>${rupee(i.amount)}</b></div><div class="linecontrols no-print"><span>${i.qty} × ${rupee(i.price)}</span><button class="iconbtn" onclick="dec('${i.id}')">−</button><button class="iconbtn" style="color:var(--green)" onclick="add('${i.id}')">+</button><button class="iconbtn" onclick="removeItem('${i.id}')">×</button></div><div class="printinfo" style="display:none">${i.qty} × ${rupee(i.price)}</div></div>`).join(""):`<div class="empty">No items added yet.<br>Tap a menu item to build the bill.</div>`}</div>
    <div class="totals"><div class="row"><span>Items</span><span>${t.qty}</span></div><div class="row" style="margin-top:5px"><span>Subtotal</span><span>${rupee(t.subtotal)}</span></div>${t.d?`<div class="row" style="margin-top:5px;color:var(--red)"><span>Discount</span><span>- ${rupee(t.d)}</span></div>`:""}<div class="row" style="margin-top:5px"><span>CGST 2.5%</span><span>${rupee(t.cgst)}</span></div><div class="row" style="margin-top:5px"><span>SGST 2.5%</span><span>${rupee(t.sgst)}</span></div><div class="row" style="margin-top:5px"><span>Round Off</span><span>${t.round>=0?"+":""}${rupee(t.round)}</span></div><div class="row total"><span>TOTAL</span><span>${rupee(t.grand)}</span></div></div>
    <div class="payments no-print"><div class="paytitle">PAYMENT METHOD</div><div class="paygrid">${["Cash","UPI","Card"].map(p=>`<button class="pay ${state.payment===p?'active':''}" onclick="state.payment='${p}';render()">${p}</button>`).join("")}</div></div>
    <div class="discount no-print"><input type="number" min="0" placeholder="Discount" value="${state.discount}" oninput="state.discount=this.value;render()"><select onchange="state.discountType=this.value;render()"><option value="amount" ${state.discountType==="amount"?"selected":""}>₹</option><option value="percent" ${state.discountType==="percent"?"selected":""}>%</option></select></div>
    <div class="actions no-print"><button class="act clear" onclick="clearBill()">🗑 Clear Bill</button><button class="act print" onclick="printBill()">🖨 Print</button><button class="act complete" onclick="completeBill()">✓ Complete Bill</button></div>
    <div class="rf">Thank you for visiting ${esc(state.restaurantName)}<br>Please visit again!</div><div class="perforation"></div>
   </aside>
  </main>
  <nav class="bottom no-print"><button class="active" onclick="state.cartOpen=false;window.scrollTo(0,0);render()"><b>⌂</b>Menu</button><button onclick="state.cartOpen=true;render()"><b>🛒 ${t.qty?`<span style="color:#ff5d4c">${t.qty}</span>`:""}</b>Cart</button><button onclick="openHistory()"><b>▤</b>History</button></nav>
 </div>
 ${state.modal==="manage"?manageModal():""}${state.modal==="history"?historyModal():""}`;
}
function add(id){state.cart[id]=(state.cart[id]||0)+1;render()}
function dec(id){if(!state.cart[id])return;state.cart[id]--;if(state.cart[id]<=0)delete state.cart[id];render()}
function removeItem(id){delete state.cart[id];render()}
function clearBill(){if(confirm("Clear current bill?")){state.cart={};state.table="";state.customer="";state.discount=0;render()}}
function printBill(){if(!totals().lines.length)return alert("Add items first.");window.print()}
function completeBill(){let t=totals();if(!t.lines.length)return alert("Add items first.");let bill={id:"b"+Date.now(),billNo:state.billNo,date:new Date().toISOString(),table:state.table,customer:state.customer,items:t.lines.map(i=>({name:i.name,qty:i.qty,price:i.price,amount:i.amount})),subtotal:t.subtotal,discount:t.d,cgst:t.cgst,sgst:t.sgst,roundOff:t.round,total:t.grand,payment:state.payment};state.history.push(bill);state.billNo++;save();state.cart={};state.table="";state.customer="";state.discount=0;state.cartOpen=false;render();alert("Bill #"+bill.billNo+" completed.");}
function openManage(){state.modal="manage";render()}
function manageModal(){return `<div class="modal no-print"><div class="modalbox"><div class="mh"><h2>Manage Restaurant</h2><button class="close" onclick="state.modal=null;render()">×</button></div><div class="mb"><div class="settings"><input id="rname" value="${esc(state.restaurantName)}" placeholder="Restaurant name"><input id="gst" value="${esc(state.gstin)}" placeholder="GSTIN"></div><div class="newrow"><input id="newname" placeholder="New item name"><select id="newcat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="newprice" type="number" placeholder="Price"><button class="save" onclick="addMenu()">+</button></div><div>${state.menu.map(i=>`<div class="edit"><input id="n-${i.id}" value="${esc(i.name)}"><select id="c-${i.id}">${CATS.map(c=>`<option ${i.category===c?"selected":""}>${c}</option>`).join("")}</select><input id="p-${i.id}" type="number" value="${i.price}"><button class="del" onclick="deleteMenu('${i.id}')">×</button></div>`).join("")}</div><div class="modalfoot"><button class="save" onclick="saveSettings()">Save Changes</button></div></div></div></div>`}
function addMenu(){let n=document.getElementById("newname").value.trim(),c=document.getElementById("newcat").value,p=Number(document.getElementById("newprice").value);if(!n||p<=0)return alert("Enter item name and valid price.");state.menu.push({id:"m"+Date.now(),name:n,category:c,price:p});save();render()}
function deleteMenu(id){if(!confirm("Delete this item?"))return;state.menu=state.menu.filter(i=>i.id!==id);delete state.cart[id];save();render()}
function saveSettings(){state.restaurantName=document.getElementById("rname").value.trim()||"Tandoor & Co.";state.gstin=document.getElementById("gst").value.trim()||"22ABCDE1234F1Z5";state.menu=state.menu.map(i=>({id:i.id,name:document.getElementById("n-"+i.id).value.trim(),category:document.getElementById("c-"+i.id).value,price:Number(document.getElementById("p-"+i.id).value)||0})).filter(i=>i.name&&i.price>0);save();state.modal=null;render()}
function openHistory(){state.modal="history";render()}
function historyModal(){let now=new Date();let bs=state.history.filter(b=>state.period==="today"?new Date(b.date).toDateString()===now.toDateString():state.period==="week"?(now-new Date(b.date))<=7*864e5:(now-new Date(b.date))<=30*864e5);let total=bs.reduce((a,b)=>a+b.total,0),qty=bs.reduce((a,b)=>a+b.items.reduce((x,i)=>x+i.qty,0),0);return `<div class="modal no-print"><div class="modalbox"><div class="mh"><h2>Sales History</h2><button class="close" onclick="state.modal=null;render()">×</button></div><div class="mb"><div class="periods">${[["today","Today"],["week","7 Days"],["month","30 Days"]].map(x=>`<button class="${state.period===x[0]?"active":""}" onclick="state.period='${x[0]}';render()">${x[1]}</button>`).join("")}</div><div class="stats"><div class="stat"><small>SALES</small><b>${rupee(total)}</b></div><div class="stat"><small>BILLS</small><b>${bs.length}</b></div><div class="stat"><small>ITEMS</small><b>${qty}</b></div></div>${bs.length?[...bs].reverse().map(b=>`<div class="historycard"><div class="row"><b>Bill #${b.billNo}</b><b>${rupee(b.total)}</b></div><div style="font-size:9px;color:var(--muted);margin-top:4px">${new Date(b.date).toLocaleString("en-IN")} · ${esc(b.payment)}${b.table?" · Table "+esc(b.table):""}</div><div style="font-size:9px;margin-top:5px">${b.items.map(i=>esc(i.name)+" × "+i.qty).join(", ")}</div></div>`).join(""):`<div class="empty">No bills found.</div>`}</div></div></div>`}
render();
</script>
</body>
</html>
